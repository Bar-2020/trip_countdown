name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The AWS values are stored as secrets, not variables: GitHub masks secrets in workflow
  # logs, while variables are printed in plain text (public in a public repo) and these
  # values contain the AWS account ID. A job-level `if` cannot read secrets, so this small
  # job reports whether they exist, and the deploy job is skipped until AWS_ROLE_ARN is set.
  check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
    steps:
      - id: gate
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: ${{ needs.check.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Also hide the account ID wherever else it shows up in the logs.
          mask-aws-account-id: true

      # Vite fingerprints everything under assets/, so it can be cached for a year.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"

      # index.html and favicon.svg are not fingerprinted, so they keep a short cache.
      - name: Upload everything else
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" \
            --exclude "assets/*" \
            --delete \
            --cache-control "public,max-age=300"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
